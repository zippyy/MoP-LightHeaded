name: Scrape Wowhead Midnight Data

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'Start index into midnight_quest_ids.txt'
        required: false
        default: '0'
      max_quests:
        description: 'Maximum quests to scrape this run'
        required: false
        default: '750'

permissions:
  contents: write

jobs:
  scrape-wowhead:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LH_START_INDEX: ${{ github.event.inputs.start_index || '0' }}
      LH_MAX_QUESTS: ${{ github.event.inputs.max_quests || '750' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Scrape Wowhead Midnight data
        run: |
          python tools/scrape_wowhead_midnight_data.py

      - name: Show generated pack info
        run: |
          ls -lah LightHeaded/Data/
          wc -l LightHeaded/Data/LH_Data_Midnight.lua

      - name: Commit generated Midnight pack
        run: |
          if git diff --quiet -- LightHeaded/Data/LH_Data_Midnight.lua; then
            echo "No Midnight data changes generated."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add LightHeaded/Data/LH_Data_Midnight.lua
          git commit -m "Scrape Wowhead Midnight data"
          git push
