name: Discover Midnight Quest IDs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LH_DISCOVER_MAX_PAGES: 250

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show checked out commit
        run: |
          git rev-parse HEAD
          grep -n "wait_until" tools/discover_midnight_quest_ids.py || true
          grep -n "networkidle" tools/discover_midnight_quest_ids.py || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Import QuestV2 DB2 IDs
        run: |
          python tools/import_questv2_db2.py || true

      - name: Discover Midnight quest IDs
        run: |
          python tools/discover_midnight_quest_ids.py

      - name: Commit updated quest ID list
        run: |
          if git diff --quiet -- tools/midnight_quest_ids.txt; then
            echo "No quest ID changes discovered."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tools/midnight_quest_ids.txt
          git commit -m "Update discovered Midnight quest IDs"
          git push
