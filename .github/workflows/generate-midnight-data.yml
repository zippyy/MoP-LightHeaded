name: Generate Midnight Data Pack

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 0'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Generate Midnight data pack
        run: python tools/generate_midnight_pack.py

      - name: Commit generated data pack
        run: |
          if git diff --quiet -- LightHeaded/Data/LH_Data_Midnight.lua; then
            echo "No generated data changes."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add LightHeaded/Data/LH_Data_Midnight.lua
          git commit -m "Update generated Midnight quest data"
          git push
