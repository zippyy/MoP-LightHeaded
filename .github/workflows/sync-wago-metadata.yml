name: Sync Wago Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Midnight metadata from Wago.tools
        run: |
          python tools/sync_wago_metadata.py

      - name: Show results
        run: |
          wc -l tools/midnight_quest_ids.txt
          tail -n 25 tools/midnight_quest_ids.txt || true

      - name: Commit updated quest ID list
        run: |
          if git diff --quiet -- tools/midnight_quest_ids.txt; then
            echo "No metadata changes discovered."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tools/midnight_quest_ids.txt
          git commit -m "Sync Midnight metadata from Wago.tools"
          git push
